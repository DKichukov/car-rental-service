services:
  db:
    image: postgres:14.0-alpine3.14
    container_name: postgres_db
    restart: on-failure
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - crs-network

  #### build app ####
  car-rental-service:
    container_name: crs-app
    build:
      context: ../
      dockerfile: Dockerfile
    image: djimy87/crs-app-backend:v.0.0.1
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:${DB_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - db
    networks:
      - crs-network

      ## build angular app ###
  angular-app:
    container_name: angular-app
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: djimy87/crs-app-frontend:v.0.0.1
    environment:
      API_URL: https://api.rental-car.duckdns.org
      NODE_ENV: production
    ports:
      - "4200:4200"
    networks:
      - crs-network

volumes:
  db_data:

networks:
  crs-network:
    driver: bridge
